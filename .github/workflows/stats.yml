name: Update commit stats

# Runs daily and refreshes per-project commit counts + global totals.
# Pushing the update triggers a site rebuild (Cloudflare Pages),
# so the numbers on the site stay fresh automatically.

on:
  schedule:
    # 01:00 UTC = 06:45 NPT, once a day
    - cron: '0 1 * * *'
  workflow_dispatch: # allow manual runs from the Actions tab

jobs:
  stats:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - name: Update commit stats
        run: bun scripts/update-stats.mjs
        env:
          # Create a fine-grained PAT with contents read-only access, limited
          # to the listed repos + the NCCSSoftware org, then add as a repo
          # secret named GH_STATS_TOKEN.
          GH_STATS_TOKEN: ${{ secrets.GH_STATS_TOKEN }}

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/content/projects
          git diff --cached --quiet || git commit -m "chore: update commit stats [skip ci]"
          git push
