backend:
  name: github
  repo: ChandanShakya/chandanshakya.com.np
  branch: main
  base_url: https://sveltia-cms-auth.zxy-cc-3ag13.workers.dev

media_folder: public/uploads
public_folder: /uploads
omit_empty_optional_fields: true

collections:
  - name: blog
    label: Blog
    folder: src/content/blog
    extension: md
    format: frontmatter
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - { name: title, label: Title, widget: string }
      - { name: description, label: Description, widget: text }
      - { name: date, label: Date, widget: datetime, date_format: "YYYY-MM-DD", time_format: false }
      - { name: updated, label: Updated, widget: datetime, date_format: "YYYY-MM-DD", time_format: false, required: false }
      - { name: tags, label: Tags, widget: list, default: [] }
      - { name: body, label: Body, widget: markdown }

  - name: projects
    label: Projects
    folder: src/content/projects
    extension: md
    format: frontmatter
    create: true
    slug: "{{slug}}"
    fields:
      - { name: title, label: Title, widget: string }
      - { name: description, label: Description, widget: text }
      - { name: date, label: Date, widget: datetime, date_format: "YYYY-MM-DD", time_format: false }
      - { name: updated, label: Updated, widget: datetime, date_format: "YYYY-MM-DD", time_format: false, required: false }
      - { name: category, label: Category, widget: string }
      - { name: link, label: Link, widget: string }
      - name: live
        label: Live links
        widget: list
        required: false
        fields:
          - { name: label, label: Label, widget: string }
          - { name: url, label: URL, widget: string }
      - { name: client, label: Client, widget: string }
      - { name: commits, label: Commits, widget: number, value_type: int }
      - { name: body, label: Body, widget: markdown }

  - name: photos
    label: Photos
    folder: src/content/photos
    extension: md
    format: frontmatter
    create: true
    slug: "{{slug}}"
    media_folder: /src/assets/photos
    public_folder: ../../assets/photos
    fields:
      - { name: title, label: Title, widget: string }
      - { name: image, label: Image, widget: image, required: true }
      - { name: device, label: Device, widget: relation, collection: devices, value_field: "{{slug}}", display_fields: [name], search_fields: [name], required: true }
      - { name: kind, label: Kind, widget: select, options: [{ label: Photo, value: photo }, { label: Digital Art, value: digital-art }], default: photo }
      - { name: order, label: Order (lower shows first; blank = after ordered ones, newest first), widget: number, value_type: int, required: false }
      - { name: date, label: Date, widget: datetime, date_format: "YYYY-MM-DD", time_format: false }
      - { name: location, label: Location, widget: string, required: false }
      - { name: caption, label: Caption, widget: text, required: false }
      - { name: body, label: Body, widget: markdown, required: false }

  - name: devices
    label: Devices
    folder: src/content/devices
    extension: md
    format: frontmatter
    create: true
    slug: "{{slug}}"
    media_folder: /src/assets/devices
    public_folder: ../../assets/devices
    fields:
      - { name: name, label: Name, widget: string }
      - { name: image, label: Image, widget: image, required: false }
      - { name: description, label: Description, widget: text }
      - { name: body, label: Body, widget: markdown, required: false }

  - name: finds
    label: Finds
    folder: src/content/finds
    extension: md
    format: frontmatter
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - { name: title, label: Title, widget: string }
      - { name: url, label: Link (https://...), widget: string }
      - { name: kind, label: Kind, widget: select, options: [{ label: Article, value: article }, { label: Video, value: video }, { label: Other link, value: link }], default: article }
      - { name: tags, label: Tags, widget: list, default: [], required: false }
      - { name: date, label: Date, widget: datetime, date_format: "YYYY-MM-DD", time_format: false }
      - { name: note, label: Why it's interesting, widget: text, required: false }
